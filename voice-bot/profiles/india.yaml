market: india
timezone: Asia/Kolkata
currency: INR
calling_hours:
  start: "09:00"
  end: "21:00"

providers:
  stt:
    sarvam:
      class_path: "pipecat.services.sarvam.stt.SarvamSTTService"
      api_key_env: "SARVAM_API_KEY"
      params:
        model: "saaras:v4"
        language: "unknown"
        mode: "codemix"
        sample_rate: 8000
        input_audio_codec: "wav"
        keepalive_timeout: 30
        keepalive_interval: 15
        vad_signals: true
        high_vad_sensitivity: true
        positive_speech_threshold: 0.60
        negative_speech_threshold: 0.48
        min_speech_frames: 2
        first_turn_min_speech_frames: 2
        negative_frames_count: 6
        negative_frames_window: 12
        interrupt_min_speech_frames: 2
        pre_speech_pad_frames: 3

    deepgram:
      class_path: pipecat.services.deepgram.stt.DeepgramSTTService
      api_key_env: DEEPGRAM_API_KEY
      params:
        model: nova-3
        language: multi
        interim_results: true
        punctuate: true
        smart_format: true
        profanity_filter: false
        sample_rate: 8000
        encoding: linear16
        channels: 1
        endpointing: 100

    openai:
      class_path: pipecat.services.openai.stt.OpenAISTTService
      api_key_env: OPENAI_API_KEY
      params:
        model: whisper-1

  llm:
    sarvam:
      class_path: pipecat.services.sarvam.llm.SarvamLLMService
      api_key_env: SARVAM_API_KEY
      chat_base_url: "https://api.sarvam.ai/v1"
      chat_api_key_header: "api-subscription-key"
      params:
        model: sarvam-105b-conversations
        temperature: 0.2
        max_tokens: 160
        tools: &id001
          - type: function
            function:
              name: book_site_visit
              description: "Book a site visit slot. Call ONLY after the caller has said both a day and a time, or said yes to the exact day and time you asked. Otherwise ask for the missing part."
              parameters:
                type: object
                properties:
                  date:
                    type: string
                    description: "Preferred day/date (e.g. 'Saturday', '2026-09-26')"
                  time:
                    type: string
                    description: "Concrete caller time; bare two or do baje means daytime 2 PM. Do not pass vague periods."
                required: [date, time]
                additionalProperties: false
          - type: function
            function:
              name: send_brochure
              description: "Call ONLY when the caller explicitly asks for the brochure or floor plans on WhatsApp. Never for questions about amenities, price, balconies, size or Vastu."
              parameters:
                type: object
                properties:
                  notes:
                    type: string
                    description: "Optional notes on user preferences"
                additionalProperties: false
          - type: function
            function:
              name: handoff_to_human
              description: "Escalate the lead to a senior human property advisor."
              parameters:
                type: object
                properties:
                  reason:
                    type: string
                    description: "Reason for human escalation"
                required: [reason]
                additionalProperties: false
          - type: function
            function:
              name: end_call
              description: "End call ONLY when caller explicitly says goodbye ('bye', 'take care') or repeats refusal after convincing."
              parameters:
                type: object
                properties:
                  reason:
                    type: string
                    enum:
                      - completed
                      - followup
                      - declined
                      - hostile
                required: [reason]
                additionalProperties: false

    groq:
      class_path: "pipecat.services.groq.llm.GroqLLMService"
      api_key_env: "GROQ_API_KEY"
      chat_base_url: "https://api.groq.com/openai/v1"
      params:
        model: "qwen/qwen3.8-27b"
        temperature: 0.3
        top_p: 0.85
        max_completion_tokens: 90
        extra:
          reasoning_effort: "none"
        tools: *id001


  tts:
    sarvam:
      class_path: pipecat.services.sarvam.tts.SarvamTTSService
      api_key_env: SARVAM_API_KEY
      params:
        model: bulbul:v3
        voice_id: pooja
        language: en-IN
        sample_rate: 8000
        enable_preprocessing: false
        pace: 1.02
        min_buffer_size: 30
        max_chunk_length: 120
        stop_frame_timeout_s: 8.0

    deepgram:
      class_path: pipecat.services.deepgram.tts.DeepgramTTSService
      api_key_env: DEEPGRAM_API_KEY
      params:
        voice: aura-asteria-en

voice_rules: |
  You are Ananya, Meridian Group property advisor. Help the caller choose a home and arrange a site visit.
  Speak naturally in their language, using conversational Hinglish for Hindi. Give one or two short complete sentences. Answer only what was asked; avoid extra offers and follow-up questions. State property facts, not invented best-facing or Vastu-superiority advice. Keep natural punctuation for speech. Do not reintroduce yourself or repeat answered questions.
  Use the property facts below and [ACTIVE LEAD STATE] caller preferences. Never invent facts, discounts or availability. Listen to corrections; unclear speech gets a brief repeat request.
  When the caller picks an option by reference (the smaller one, the cheaper one), acknowledge with just "Okay, got it." and then ask the next question. Never restate the full size, price or BHK already spoken.
  For visits ask only the missing day or time. Interpret bare hours as normal daytime visit hours and repeat the resolved time in confirmation. Claim booked only after book_site_visit success. Caller can correct it.
  Send WhatsApp only on specific consent; queued or accepted is not delivered. End politely on goodbye or firm refusal; never re-pitch during closing.

real_estate_sales_script: |
  Meridian Residences, Prime Tech Corridor. 2 & 3 BHKs. Possession: late 2027. 100% Vastu, East/North entry.
  - 2 BHK: 1150-1320 sq ft, East/North facing, 1 balcony, from ninety-five lakhs.
  - 3 BHK Standard: 1580-1750 sq ft, East facing, 1 balcony, one point four five to one point six five crores.
  - 3 BHK Large: 1920-2100 sq ft + study, 2 balconies (East/North facing), one point seven to one point eight crores.
  - Amenities: Pool, gym, clubhouse, 24/7 security, jogging track.
  - Location: Prime Tech Corridor (10 min to Metro, near IT hub).
  - Payment: 10% booking, construction-linked, SBI/HDFC/ICICI approved.

audio:
  sample_rate: 8000
  enable_interruptions: true

vad:
  enabled: true
  start_threshold: 0.55
  min_speech_duration: 0.20
  silence_timeout: 0.20

turn_management:
  user_speech_timeout: 0.20
  user_speech_min_duration: 0.20
  filler_debounce_seconds: 0.15
  user_turn_stop_timeout: 0.75
  smart_turn_enabled: false   # true = local Smart Turn model (slower); false = 200ms transcript-aware debounce

language:
  supported:
    - en
    - hi
    - te
  default: en
  sustained_switch_turns: 2

test_customer_name: Alex

