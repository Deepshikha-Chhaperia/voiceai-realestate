<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Meridian AI Lead Engine — Real Estate CRM{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans antialiased flex flex-col">
  <!-- Top Navigation -->
  <header class="border-b border-slate-200 bg-white sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-slate-900 flex items-center justify-center font-bold text-white shadow-sm text-sm">
          M
        </div>
        <div>
          <h1 class="font-bold text-sm tracking-tight text-slate-900">Meridian AI Lead Engine</h1>
          <p class="text-[11px] text-slate-500 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
            Market: <span class="text-slate-700 font-semibold capitalize">{{ market }}</span>
          </p>
        </div>
      </div>
      
      <nav class="flex items-center gap-1.5 sm:gap-2">
        <a href="/dashboard" class="px-3.5 py-2 rounded-lg text-xs font-semibold transition {% if active_tab == 'overview' %}bg-slate-900 text-white shadow-sm{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">Overview</a>
        <a href="/dashboard/board" class="px-3.5 py-2 rounded-lg text-xs font-semibold transition {% if active_tab == 'board' %}bg-slate-900 text-white shadow-sm{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">Leads</a>
        <a href="/dashboard/visits" class="px-3.5 py-2 rounded-lg text-xs font-semibold transition {% if active_tab == 'visits' %}bg-slate-900 text-white shadow-sm{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">Site Visits</a>
        <a href="/lp" target="_blank" class="ml-2 px-3.5 py-2 rounded-lg text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 transition">Lead Form ↗</a>
      </nav>
    </div>
  </header>

  <!-- Main Body with HTMX Auto-Polling -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full" hx-get="{{ poll_url }}" hx-trigger="every 5s" hx-select="#mainContent" hx-target="#mainContent" hx-swap="outerHTML">
    <div id="mainContent">
      {% block content %}{% endblock %}
    </div>
  </main>

  <script>
    // Preserve scroll position of scrollable containers across HTMX 5s poll updates
    const scrollMap = new Map();
    document.addEventListener('htmx:beforeSwap', function() {
      document.querySelectorAll('[data-scroll-key]').forEach(el => {
        const key = el.getAttribute('data-scroll-key');
        if (key) scrollMap.set(key, el.scrollTop);
      });
    });
    document.addEventListener('htmx:afterSwap', function() {
      document.querySelectorAll('[data-scroll-key]').forEach(el => {
        const key = el.getAttribute('data-scroll-key');
        if (key && scrollMap.has(key)) {
          el.scrollTop = scrollMap.get(key);
        }
      });
    });
  </script>
</body>
</html>
