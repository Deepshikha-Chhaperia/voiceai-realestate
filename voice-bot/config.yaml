active_providers:
  stt: sarvam
  llm: groq
  tts: sarvam

providers:
  stt:
    sarvam:
      class_path: "pipecat.services.sarvam.stt.SarvamSTTService"
      api_key_env: "SARVAM_API_KEY"
      params:
        model: "saaras:v4"
        language: "en-IN"
        mode: "codemix"
        sample_rate: 8000
        input_audio_codec: "wav"
        keepalive_timeout: 30
        keepalive_interval: 15
        vad_signals: true
        high_vad_sensitivity: true
        positive_speech_threshold: 0.70
        negative_speech_threshold: 0.48
        min_speech_frames: 2
        first_turn_min_speech_frames: 2
        negative_frames_count: 6
        negative_frames_window: 12
        interrupt_min_speech_frames: 3
        pre_speech_pad_frames: 3

    deepgram:
      class_path: pipecat.services.deepgram.stt.DeepgramSTTService
      api_key_env: DEEPGRAM_API_KEY
      params:
        model: nova-3
        language: multi
        interim_results: true
        punctuate: true
        smart_format: true
        profanity_filter: false
        sample_rate: 8000
        encoding: linear16
        channels: 1
        endpointing: 500

    openai:
      class_path: pipecat.services.openai.stt.OpenAISTTService
      api_key_env: OPENAI_API_KEY
      params:
        model: whisper-1

  llm:
    sarvam:
      class_path: pipecat.services.sarvam.llm.SarvamLLMService
      api_key_env: SARVAM_API_KEY
      chat_base_url: "https://api.sarvam.ai/v1"
      chat_api_key_header: "api-subscription-key"
      params:
        model: sarvam-105b-conversations
        temperature: 0.2
        max_tokens: 160
        tools: &id001
          - type: function
            function:
              name: end_call
              description: "End call ONLY when caller explicitly says goodbye ('bye', 'take care') or repeats refusal after convincing. NEVER call when caller says 'tell me', agrees to listen, asks questions, or is engaged."
              parameters:
                type: object
                properties:
                  reason:
                    type: string
                    enum:
                      - completed
                      - followup
                      - declined
                      - hostile
                required: [reason]
                additionalProperties: false
          - type: function
            function:
              name: book_site_visit
              description: "Book an in-person site visit to Meridian Crest. Require explicit date AND time from the caller. Do NOT call this tool until caller has confirmed BOTH a specific day/date and a time."
              parameters:
                type: object
                properties:
                  date:
                    type: string
                    description: "Specific day or date requested by caller, e.g. 'Saturday', 'tomorrow', 'October 12'."
                  time:
                    type: string
                    description: "Specific time or slot requested by caller, e.g. '11:00 AM', '3:00 PM', 'morning 11am'."
                required: [date, time]
                additionalProperties: false

    groq:
      class_path: "pipecat.services.groq.llm.GroqLLMService"
      api_key_env: "GROQ_API_KEY"
      chat_base_url: "https://api.groq.com/openai/v1"
      params:
        model: "qwen/qwen3.8-27b"
        temperature: 0.3
        top_p: 0.85
        max_completion_tokens: 60 # capped at 60 tokens for sub-500ms voice-to-voice & reduced TTS burn
        extra:
          reasoning_effort: "none"
        tools: *id001

    openrouter:
      class_path: pipecat.services.openai.llm.OpenAILLMService
      api_key_env: OPENROUTER_API_KEY
      chat_base_url: "https://openrouter.ai/api/v1"
      params:
        model: "qwen/qwen3.6-27b"
        base_url: https://openrouter.ai/api/v1
        temperature: 0.3
        top_p: 0.85
        max_completion_tokens: 120
        extra:
          extra_body:
            provider:
              order:
                - Venice
              allow_fallbacks: true
        tools: *id001

  tts:
    murf:
      class_path: services.murf_http.MurfFalcon2TTSService
      api_key_env: MURF_API_KEY
      _needs_aiohttp: true
      params:
        model: falcon-2
        voice_id: Anisha
        locale: en-IN
        base_url: https://in.api.murf.ai
        sample_rate: 8000
        channel_type: MONO
        format: PCM
        request_timeout_seconds: 30

    sarvam:
      class_path: pipecat.services.sarvam.tts.SarvamTTSService
      api_key_env: SARVAM_API_KEY
      params:
        model: bulbul:v3
        voice_id: pooja
        language: en-IN
        sample_rate: 8000
        enable_preprocessing: false
        pace: 1.02
        # Buffer threshold before starting synthesis (Sarvam API requires range: 30-200)
        min_buffer_size: 30 #earlier 30
        max_chunk_length: 120
        stop_frame_timeout_s: 8.0

    deepgram:
      class_path: pipecat.services.deepgram.tts.DeepgramTTSService
      api_key_env: DEEPGRAM_API_KEY
      params:
        voice: aura-asteria-en


voice_rules: |
  Role: Ananya, Senior Property Advisor, Meridian Group. Outbound call.
  Style: 1-2 short sentences (max ~25 words). Warm, conversational, direct. Address multiple questions concisely. Spoken dialogue only—no code, parameters, '=', or parentheses.
  Constraints: Never close on first objection, compare costlier areas, re-offer brochure, invent discounts, or repeat greeting. Conclude only when caller says goodbye or after firm refusal.

  Rules:
  - Anchor answers to chosen unit in [ACTIVE LEAD STATE].
  - Discovery: When BHK picked, offer options: "We have fifteen eighty sq ft from one point four five crore. Or twenty-one hundred sq ft from one point seven crore. Which size do you prefer?" (2 BHK: eleven fifty sq ft from ninety-five lakhs).
  - Ownership: On mismatch: "You are right—I should have kept your preference." Then stop.
  - Objections:
    * 1 (general/uninterested): "Totally understand, is it the location, price, or just not the right time?"
    * 2 (price/location): Address concisely (10% booking plan, SBI/HDFC/ICICI loans, 10 min to Metro). Offer WhatsApp once: "May I share the brochure and floor plans on WhatsApp so you can review at your leisure?"
    * Firm refusal (rejects WhatsApp or repeats no): "Understood, thanks for your time. Have a great day!" and close.
  - Pauses: If caller pauses or says "and...", say "Yes, go ahead?"
  - Tools:
    * book_site_visit: Call only when caller confirms BOTH day and time (ask time first if missing). Speak NO text in tool call response. Never claim booked in speech.
    * send_brochure: Confirm warmly and call when caller requests brochure or WhatsApp.
    * handoff_to_human: Call if caller insists on talking to a human or manager.
  - Languages: English, Hinglish, Telugu. Hinglish baseline for Hindi (natural words: location, price, budget, flat, possession). Switch to pure conversational Telugu when Telugu requested or spoken.

termination_rules: ""

real_estate_sales_script: |
  Meridian Residences, Prime Tech Corridor. 2 & 3 BHKs. Possession: late 2027. 100% Vastu, East/North entry.
  - 2 BHK: 1150-1320 sq ft, East/North facing, 1 balcony, from ninety-five lakhs.
  - 3 BHK Standard: 1580-1750 sq ft, East facing, 1 balcony, one point four five to one point six five crores.
  - 3 BHK Large: 1920-2100 sq ft + study, 2 balconies (East/North facing), one point seven to one point eight crores.
  - Amenities: Pool, gym, clubhouse, 24/7 security, jogging track.
  - Location: Prime Tech Corridor (10 min to Metro, near IT hub).
  - Payment: 10% booking, construction-linked, SBI/HDFC/ICICI approved.


base_prompt: ""


greeting_inbound: "The caller just connected. Greet them briefly and ask how you can help."
greeting_outbound: "You just called this person. Start with the opening from the campaign script."

# Fallback utterances for side-channel timeouts or failures
fallback_closing_text: "Thanks so much for your time today. Have a great day!"
continuation_fallback: "Is there anything else I can help with?"

# In-service connection and prompt pre-warming during initial greeting playback.
llm_cache_prewarm_enabled: true
llm_prewarm_timeout: 4.0

max_conversation_messages: 8

audio:
  sample_rate: 8000
  enable_interruptions: true

# Neural noise suppression for incoming audio (RNNoise)
noise_suppression_enabled: true

vad:
  enabled: true
  start_threshold: 0.55
  min_speech_duration: 0.20
  silence_timeout: 0.50

silence_nudge_first_secs: 15
filler_timeout_ms: 700
preemptive_llm_enabled: false

turn_management:
  user_speech_timeout: 0.20
  user_speech_min_duration: 0.20
  filler_debounce_seconds: 0.25
  user_turn_stop_timeout: 0.75

metrics:
  enable_metrics: true
  enable_usage_metrics: true

# Maximum call duration safety net (seconds)
max_call_duration_seconds: 360

language:
  supported:
    - en
    - hi
    - te
  default: en
  first_turn_confidence: 0.75
  sustained_switch_turns: 1
  initial: en

termination_processor:
  silent_patterns:
    - name: end_call_leak
      pattern: \bend[_\s-]?call\b\.?
    - name: tool_narration
      pattern: \b(call|dial|invok|trigger|activat)\w*\s+(the\s+)?(tool|function|api)\b
    - name: explicit_command
      pattern: \b(end|clos|terminat|finish|hang)\w*\s+(the\s+)?(call|conversation|session|up|tool)\b
    - name: disposition_leak
      pattern: \b(site\s+visit|inventory|lead)\s+(is\s+)?(booked|sent|partial)\b
    - name: explicit_tag
      pattern: \[hangup\]|\[end\]
    - name: transcript_recitation_leak
      pattern: \b(user|caller|assistant|system)\s*:\s*["“]

spoken_patterns:
  - \b(goodbye|bye|take care|alvida|dhanyavaad|dhanyavad|dhanyawaad|shukriya|phir\s*milenge|shubh\s*ho|din\s*shubh|achha\s*rahe|din\s*achha|malli\s*kaluddam|selavu|untanu)\b
  - \bhave a (nice|great|good|wonderful) (day|evening|night|time)\b
  - \btalk to you (later|soon)\b
  - \bsee you (tomorrow|later|soon|then)\b
  - (शुभ\s*हो|दिन\s*शुभ|अलविदा|धन्यवाद|शुक्रिया|फिर\s*मिलेंगे|शुभ\s*दिन|ధన్యవాదాలు)

test_customer_name: Alex


