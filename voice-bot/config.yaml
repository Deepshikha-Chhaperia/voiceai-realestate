active_providers:
  stt: sarvam
  llm: groq
  tts: sarvam
  llm_fallback: cerebras

providers:
  stt:
    sarvam:
      class_path: "pipecat.services.sarvam.stt.SarvamSTTService"
      api_key_env: "SARVAM_API_KEY"
      params:
        model: "saaras:v4"
        language: "unknown"
        mode: "codemix"
        sample_rate: 8000
        input_audio_codec: "wav"
        keepalive_timeout: 30
        keepalive_interval: 15
        vad_signals: true
        high_vad_sensitivity: true
        positive_speech_threshold: 0.70
        negative_speech_threshold: 0.48
        min_speech_frames: 2
        first_turn_min_speech_frames: 2
        negative_frames_count: 6
        negative_frames_window: 12
        interrupt_min_speech_frames: 3
        pre_speech_pad_frames: 3

    deepgram:
      class_path: pipecat.services.deepgram.stt.DeepgramSTTService
      api_key_env: DEEPGRAM_API_KEY
      params:
        model: nova-3
        language: multi
        interim_results: true
        punctuate: true
        smart_format: true
        profanity_filter: false
        sample_rate: 8000
        encoding: linear16
        channels: 1
        endpointing: 500

    openai:
      class_path: pipecat.services.openai.stt.OpenAISTTService
      api_key_env: OPENAI_API_KEY
      params:
        model: whisper-1

  llm:
    sarvam:
      class_path: pipecat.services.sarvam.llm.SarvamLLMService
      api_key_env: SARVAM_API_KEY
      chat_base_url: "https://api.sarvam.ai/v1"
      chat_api_key_header: "api-subscription-key"
      params:
        model: sarvam-105b-conversations
        temperature: 0.2
        max_tokens: 160
        tools: &id001
          - type: function
            function:
              name: end_call
              description: "End call ONLY when caller explicitly says goodbye ('bye', 'take care') or repeats refusal after convincing. NEVER call when caller says 'tell me', agrees to listen, asks questions, or is engaged."
              parameters:
                type: object
                properties:
                  reason:
                    type: string
                    enum:
                      - completed
                      - followup
                      - declined
                      - hostile
                required: [reason]
                additionalProperties: false

    groq:
      class_path: "pipecat.services.groq.llm.GroqLLMService"
      api_key_env: "GROQ_API_KEY"
      chat_base_url: "https://api.groq.com/openai/v1"
      params:
        model: "qwen/qwen3.8-27b"
        temperature: 0.3
        top_p: 0.85
        max_completion_tokens: 60 # capped at 60 tokens for sub-500ms voice-to-voice & reduced TTS burn
        extra:
          reasoning_effort: "none"
        tools: *id001

    openrouter:
      class_path: pipecat.services.openai.llm.OpenAILLMService
      api_key_env: OPENROUTER_API_KEY
      chat_base_url: "https://openrouter.ai/api/v1"
      params:
        model: "qwen/qwen3.6-27b"
        base_url: https://openrouter.ai/api/v1
        temperature: 0.3
        top_p: 0.85
        max_completion_tokens: 120
        extra:
          extra_body:
            provider:
              order:
                - Venice
              allow_fallbacks: true
        tools: *id001

    cerebras:
      class_path: pipecat.services.openai.llm.OpenAILLMService
      api_key_env: CEREBRAS_API_KEY
      params:
        model: qwen-3.8-27b
        base_url: https://api.cerebras.ai/v1
        temperature: 0.3
        max_completion_tokens: 120
        extra:
          reasoning_effort: "none"
          extra_body:
            reasoning_effort: "none"
        tools: *id001

  tts:
    murf:
      class_path: services.murf_http.MurfFalcon2TTSService
      api_key_env: MURF_API_KEY
      _needs_aiohttp: true
      params:
        model: falcon-2
        voice_id: Anisha
        locale: en-IN
        base_url: https://in.api.murf.ai
        sample_rate: 8000
        channel_type: MONO
        format: PCM
        request_timeout_seconds: 30

    sarvam:
      class_path: pipecat.services.sarvam.tts.SarvamTTSService
      api_key_env: SARVAM_API_KEY
      params:
        model: bulbul:v3
        voice_id: pooja
        language: en-IN
        sample_rate: 8000
        enable_preprocessing: false
        pace: 1.02
        # Buffer threshold before starting synthesis (Sarvam API requires range: 30-200)
        min_buffer_size: 30 #earlier 30
        max_chunk_length: 120
        stop_frame_timeout_s: 8.0

    elevenlabs:
      class_path: services.elevenlabs_http.HttpElevenLabsTTSService
      api_key_env: ELEVENLABS_API_KEY
      params:
        voice_id: EXAVITQu4vr4xnSDxMaL
        model: eleven_turbo_v2_5
        optimize_streaming_latency: 3
        chunk_size: 640
        sample_rate: 8000

    deepgram:
      class_path: pipecat.services.deepgram.tts.DeepgramTTSService
      api_key_env: DEEPGRAM_API_KEY
      params:
        voice: aura-asteria-en


voice_rules: |
  Role: Ananya, Senior Property Advisor, Meridian Group. Outbound call. Spoken words only.
  Style: 1-2 short sentences (max ~25 words unless caller explicitly asks for detail). Warm, natural, direct. If caller asks multiple things, address each concisely.
  Output Format: Immediate spoken words only. Never output code, function calls, programming syntax, parameter names, '=', or parentheses. You are speaking on a live voice phone call to a customer. Every word you produce must be natural human spoken conversation.

  Directives:
  - Answers: Answer accurately, anchored to chosen unit in [ACTIVE LEAD STATE]. If multiple questions asked in one turn, address each clearly.
  - Unit Specs: 3 BHK Large has 2 balconies (East & North facing). 3 BHK Standard has 1 balcony.
  - Discovery: When BHK picked, share options in two short sentences: "We have fifteen eighty sq ft from 1.45 Cr. Or twenty-one hundred sq ft from 1.7 Cr. Which size do you prefer?" (2 BHK: eleven fifty sq ft from 95 Lakhs).
  - Graceful Ownership: If caller questions a mismatch, own it: "You are right—I should have kept your preference." Then stop.
  - Objections (Consultative Sales):
    * Attempt 1 ("not interested"): Probe root cause: "Totally understand, is it the location, price, or just not the right time?" Never close on first objection.
    * Attempt 2 (Specific concern): Address concisely. For price concern: lead with the flexible 10% booking payment plan (construction-linked, loan-approved by SBI/HDFC/ICICI, or 2 BHK from 95L). For location concern: highlight Prime Tech Corridor connectivity (10 mins to Metro). Offer WhatsApp fallback at most once: "May I share the brochure and floor plans on WhatsApp so you can review at your leisure?" Never introduce costlier comparison areas. Never repeat brochure offer.
    * Firm Refusal: ONLY if caller refuses WhatsApp or repeats "no / not interested", accept gracefully: "Understood, thanks for your time. Have a great day!" and close.
  - Tools & Actions:
    * Site Visit: When caller agrees to visit or gives a day/time, confirm it warmly in natural conversational words (e.g. "Wonderful, I have scheduled your site visit for Saturday at 4 PM. You will receive the location on WhatsApp.") and invoke `book_site_visit`. NEVER speak function names, code syntax, or '=' out loud.
    * Brochure: When caller asks for brochure or WhatsApp, confirm warmly (e.g. "Certainly, I am sending the brochure and floor plans to your WhatsApp.") and invoke `send_brochure`. Never speak function names or syntax out loud.
    * Human Handoff: Invoke `handoff_to_human` if caller insists on speaking to a manager/human.
  - Opening: Turn 1 after caller confirms: "Great, this is Ananya from Meridian Group. Are you looking for a 2 or 3 BHK?" Never repeat intro.
  - Flow: If caller pauses or says "and...", say "Yes, go ahead?" Never end call on mere acknowledgments.
  - Ending: Conclude ONLY when caller explicitly says goodbye.
  - Language: Exactly three languages supported (English, Hindi/Hinglish, Telugu). Hinglish is the natural conversational baseline for Hindi callers (use regular words: location, price, budget, flat, possession, have a great day; avoid formal Hindi like स्थान, कीमत). When Telugu requested/detected -> reply ONLY in conversational Telugu.
  - Scope: Stick to script facts only—never invent discounts.

termination_rules: ""

real_estate_sales_script: |
  PROPERTY: Meridian Residences, Prime Tech Corridor. 2 & 3 BHKs. Price: 95 Lakhs to 1.8 Crores. Possession: late 2027 (Under Construction).
  - 2 BHK: 1150 to 1320 sq ft, East & North facing, 1 balcony, from 95 Lakhs.
  - 3 BHK Standard: 1580 to 1750 sq ft, East facing, 1 balcony, 1.45 to 1.65 Crores.
  - 3 BHK Large: 1920 to 2100 sq ft, study, 2 balconies (both East & North facing units have 2 balconies), 1.7 to 1.8 Crores.
  - Vastu & Facing: 100% Vastu compliant. East & North facing main entries.
  - Amenities: Pool, gym, clubhouse, 24/7 security, jogging track.
  - Location: Prime Tech Corridor (10 mins to Metro, near IT hub & tech parks, cafes and malls nearby).
  - Booking: 10%, construction-linked, SBI/HDFC/ICICI approved.


base_prompt: ""


greeting_inbound: "The caller just connected. Greet them briefly and ask how you can help."
greeting_outbound: "You just called this person. Start with the opening from the campaign script."

# Fallback utterances for side-channel timeouts or failures
fallback_closing_text: "Thanks so much for your time today. Have a great day!"
continuation_fallback: "Is there anything else I can help with?"

# In-service connection and prompt pre-warming during initial greeting playback.
llm_cache_prewarm_enabled: true
llm_prewarm_timeout: 4.0

# Preserves 6 conversation messages (3 turns) for conversational memory while cutting prompt token burn.
max_conversation_messages: 6 # earlier 8

audio:
  sample_rate: 8000
  enable_interruptions: true

# Neural noise suppression for incoming audio (RNNoise)
noise_suppression_enabled: true

vad:
  enabled: true
  start_threshold: 0.55
  min_speech_duration: 0.20
  silence_timeout: 0.50

silence_nudge_first_secs: 15
filler_timeout_ms: 700
preemptive_llm_enabled: false

turn_management:
  user_speech_timeout: 0.20
  user_speech_min_duration: 0.20
  filler_debounce_seconds: 0.25
  user_turn_stop_timeout: 0.75

metrics:
  enable_metrics: true
  enable_usage_metrics: true

# Maximum call duration safety net (seconds)
max_call_duration_seconds: 360

language:
  supported:
    - en
    - de
  default: en
  first_turn_confidence: 0.75
  sustained_switch_turns: 1
  initial: en

termination_processor:
  silent_patterns:
    - name: end_call_leak
      pattern: \bend[_\s-]?call\b\.?
    - name: tool_narration
      pattern: \b(call|dial|invok|trigger|activat)\w*\s+(the\s+)?(tool|function|api)\b
    - name: explicit_command
      pattern: \b(end|clos|terminat|finish|hang)\w*\s+(the\s+)?(call|conversation|session|up|tool)\b
    - name: disposition_leak
      pattern: \b(site\s+visit|inventory|lead)\s+(is\s+)?(booked|sent|partial)\b
    - name: explicit_tag
      pattern: \[hangup\]|\[end\]
    - name: transcript_recitation_leak
      pattern: \b(user|caller|assistant|system)\s*:\s*["“]

spoken_patterns:
  - \b(goodbye|bye|take care|alvida|dhanyavaad|dhanyavad|dhanyawaad|shukriya|phir\s*milenge|shubh\s*ho|din\s*shubh|achha\s*rahe|din\s*achha|malli\s*kaluddam|selavu|untanu)\b
  - \bhave a (nice|great|good|wonderful) (day|evening|night|time)\b
  - \btalk to you (later|soon)\b
  - \bsee you (tomorrow|later|soon|then)\b
  - (शुभ\s*हो|दिन\s*शुभ|अलविदा|धन्यवाद|शुक्रिया|फिर\s*मिलेंगे|शुभ\s*दिन|ధన్యవాదాలు)

