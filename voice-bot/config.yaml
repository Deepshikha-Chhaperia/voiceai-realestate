active_providers:
  stt: sarvam
  llm: groq
  tts: sarvam

providers:
  stt:
    sarvam:
      class_path: "pipecat.services.sarvam.stt.SarvamSTTService"
      api_key_env: "SARVAM_API_KEY"
      params:
        model: "saaras:v4"
        language: "unknown"
        mode: "codemix"
        sample_rate: 8000
        input_audio_codec: "wav"
        keepalive_timeout: 30
        keepalive_interval: 15
        vad_signals: true
        high_vad_sensitivity: true
        positive_speech_threshold: 0.70
        negative_speech_threshold: 0.48
        min_speech_frames: 2
        first_turn_min_speech_frames: 2
        negative_frames_count: 6
        negative_frames_window: 12
        interrupt_min_speech_frames: 3
        pre_speech_pad_frames: 3

    deepgram:
      class_path: pipecat.services.deepgram.stt.DeepgramSTTService
      api_key_env: DEEPGRAM_API_KEY
      params:
        model: nova-3
        language: multi
        interim_results: true
        punctuate: true
        smart_format: true
        profanity_filter: false
        sample_rate: 8000
        encoding: linear16
        channels: 1
        endpointing: 500

    openai:
      class_path: pipecat.services.openai.stt.OpenAISTTService
      api_key_env: OPENAI_API_KEY
      params:
        model: whisper-1

  llm:
    sarvam:
      class_path: pipecat.services.sarvam.llm.SarvamLLMService
      api_key_env: SARVAM_API_KEY
      chat_base_url: "https://api.sarvam.ai/v1"
      chat_api_key_header: "api-subscription-key"
      params:
        model: sarvam-105b-conversations
        temperature: 0.2
        max_tokens: 160
        tools: &id001
          - type: function
            function:
              name: end_call
              description: "End call ONLY when caller explicitly says goodbye ('bye', 'take care') or repeats refusal after convincing. NEVER call when caller says 'tell me', agrees to listen, asks questions, or is engaged."
              parameters:
                type: object
                properties:
                  reason:
                    type: string
                    enum:
                      - completed
                      - followup
                      - declined
                      - hostile
                required: [reason]
                additionalProperties: false
          - type: function
            function:
              name: book_site_visit
              description: "Book an in-person site visit to Meridian Crest. Require explicit date AND time from the caller. Do NOT call this tool until caller has confirmed BOTH a specific day/date and a time."
              parameters:
                type: object
                properties:
                  date:
                    type: string
                    description: "Specific day or date requested by caller, e.g. 'Saturday', 'tomorrow', 'October 12'."
                  time:
                    type: string
                    description: "Concrete caller time; bare two or do baje means daytime 2 PM. Do not pass vague periods."
                required: [date, time]
                additionalProperties: false

    groq:
      class_path: "pipecat.services.groq.llm.GroqLLMService"
      api_key_env: "GROQ_API_KEY"
      chat_base_url: "https://api.groq.com/openai/v1"
      params:
        model: "qwen/qwen3.8-27b"
        temperature: 0.3
        top_p: 0.85
        max_completion_tokens: 90 # headroom for complete sentences, not a target length
        extra:
          reasoning_effort: "none"
        tools: *id001

    openrouter:
      class_path: pipecat.services.openai.llm.OpenAILLMService
      api_key_env: OPENROUTER_API_KEY
      chat_base_url: "https://openrouter.ai/api/v1"
      params:
        model: "qwen/qwen3.6-27b"
        base_url: https://openrouter.ai/api/v1
        temperature: 0.3
        top_p: 0.85
        max_completion_tokens: 120
        extra:
          extra_body:
            provider:
              order:
                - Venice
              allow_fallbacks: true
        tools: *id001

  tts:
    murf:
      class_path: services.murf_http.MurfFalcon2TTSService
      api_key_env: MURF_API_KEY
      _needs_aiohttp: true
      params:
        model: falcon-2
        voice_id: Anisha
        locale: en-IN
        base_url: https://in.api.murf.ai
        sample_rate: 8000
        channel_type: MONO
        format: PCM
        request_timeout_seconds: 30

    sarvam:
      class_path: pipecat.services.sarvam.tts.SarvamTTSService
      api_key_env: SARVAM_API_KEY
      params:
        model: bulbul:v3
        voice_id: pooja
        language: en-IN
        sample_rate: 8000
        enable_preprocessing: false
        pace: 1.02
        # Buffer threshold before starting synthesis (Sarvam API requires range: 30-200)
        min_buffer_size: 30 #earlier 30
        max_chunk_length: 120
        stop_frame_timeout_s: 8.0

    deepgram:
      class_path: pipecat.services.deepgram.tts.DeepgramTTSService
      api_key_env: DEEPGRAM_API_KEY
      params:
        voice: aura-asteria-en


voice_rules: |
  You are Ananya, Meridian Group property advisor. Help the caller choose a home and arrange a site visit.
  Speak naturally in their language, using conversational Hinglish for Hindi. Give one or two short complete sentences. Answer only what was asked; avoid extra offers and follow-up questions. State property facts, not invented best-facing or Vastu-superiority advice. Keep natural punctuation for speech. Do not reintroduce yourself or repeat answered questions.
  Use the property facts below and [ACTIVE LEAD STATE] caller preferences. Never invent facts, discounts or availability. Listen to corrections; unclear speech gets a brief repeat request.
  For visits ask only the missing day or time. Interpret bare hours as normal daytime visit hours and repeat the resolved time in confirmation. Claim booked only after book_site_visit success. Caller can correct it.
  Send WhatsApp only on specific consent; queued or accepted is not delivered. End politely on goodbye or firm refusal; never re-pitch during closing.

real_estate_sales_script: |
  Meridian Residences, Prime Tech Corridor. 2 & 3 BHKs. Possession: late 2027. 100% Vastu, East/North entry.
  - 2 BHK: 1150-1320 sq ft, East/North facing, 1 balcony, from ninety-five lakhs.
  - 3 BHK Standard: 1580-1750 sq ft, East facing, 1 balcony, one point four five to one point six five crores.
  - 3 BHK Large: 1920-2100 sq ft + study, 2 balconies (East/North facing), one point seven to one point eight crores.
  - Amenities: Pool, gym, clubhouse, 24/7 security, jogging track.
  - Location: Prime Tech Corridor (10 min to Metro, near IT hub).
  - Payment: 10% booking, construction-linked, SBI/HDFC/ICICI approved.


base_prompt: ""


greeting_inbound: "The caller just connected. Greet them briefly and ask how you can help."
greeting_outbound: "You just called this person. Start with the opening from the campaign script."

# Fallback utterances for side-channel timeouts or failures
fallback_closing_text: "Thanks so much for your time today. Have a great day!"
continuation_fallback: "Is there anything else I can help with?"

# In-service connection and prompt pre-warming during initial greeting playback.
llm_cache_prewarm_enabled: false
llm_prewarm_timeout: 4.0

max_conversation_messages: 6  # was 8; Oct 4 value. [ACTIVE LEAD STATE] carries long-term slots

audio:
  sample_rate: 8000
  enable_interruptions: true

# Neural noise suppression for incoming audio (RNNoise)
noise_suppression_enabled: true

vad:
  enabled: true
  start_threshold: 0.55
  min_speech_duration: 0.20
  silence_timeout: 0.50

silence_nudge_first_secs: 15
# Second Groq model used when the primary Groq model fails / hits 429 (same GROQ_API_KEY). "" disables.
llm_backup_groq_model: ""  # set only after local authenticated model-list validation
filler_timeout_ms: 700
preemptive_llm_enabled: false

turn_management:
  user_speech_timeout: 0.20
  user_speech_min_duration: 0.20
  filler_debounce_seconds: 0.15
  user_turn_stop_timeout: 0.75
  smart_turn_enabled: false

metrics:
  enable_metrics: true
  enable_usage_metrics: true

# Maximum call duration safety net (seconds)
max_call_duration_seconds: 360

language:
  supported:
    - en
    - hi
    - te
  default: en
  first_turn_confidence: 0.75
  sustained_switch_turns: 1
  initial: en

termination_processor:
  silent_patterns:
    - name: end_call_leak
      pattern: \bend[_\s-]?call\b\.?
    - name: tool_narration
      pattern: \b(call|dial|invok|trigger|activat)\w*\s+(the\s+)?(tool|function|api)\b
    - name: explicit_command
      pattern: \b(end|clos|terminat|finish|hang)\w*\s+(the\s+)?(call|conversation|session|up|tool)\b
    - name: disposition_leak
      pattern: \b(site\s+visit|inventory|lead)\s+(is\s+)?(booked|sent|partial)\b
    - name: explicit_tag
      pattern: \[hangup\]|\[end\]
    - name: transcript_recitation_leak
      pattern: \b(user|caller|assistant|system)\s*:\s*["“]

spoken_patterns:
  - \b(goodbye|bye|take care|alvida|dhanyavaad|dhanyavad|dhanyawaad|shukriya|phir\s*milenge|shubh\s*ho|din\s*shubh|achha\s*rahe|din\s*achha|malli\s*kaluddam|selavu|untanu)\b
  - \bhave a (nice|great|good|wonderful) (day|evening|night|time)\b
  - \btalk to you (later|soon)\b
  - \bsee you (tomorrow|later|soon|then)\b
  - (शुभ\s*हो|दिन\s*शुभ|अलविदा|धन्यवाद|शुक्रिया|फिर\s*मिलेंगे|शुभ\s*दिन|ధన్యవాదాలు)

test_customer_name: Alex


cost_rates:
  usd_to_inr: 95.83
  llm:
    # Groq Qwen 3.8-27b ($0.80 input / $4.00 output per 1M tokens)
    "groq:qwen/qwen3.8-27b":
      prompt_per_mtok: 0.80
      completion_per_mtok: 4.00
    "groq:qwen-3.8-27b":
      prompt_per_mtok: 0.80
      completion_per_mtok: 4.00
    "qwen/qwen3.8-27b":
      prompt_per_mtok: 0.80
      completion_per_mtok: 4.00
    "groq":
      prompt_per_mtok: 0.80
      completion_per_mtok: 4.00

    # Cerebras qwen-3.8-27b: $0.99 input / $1.49 output per 1M tokens.
    # Source: https://inference-docs.cerebras.ai/models/qwen-3.8-27b
    "cerebras:qwen-3.8-27b":
      prompt_per_mtok: 0.99
      completion_per_mtok: 1.49
    "cerebras:qwen/qwen3.8-27b":
      prompt_per_mtok: 0.99
      completion_per_mtok: 1.49
    "qwen-3.8-27b":
      prompt_per_mtok: 0.99
      completion_per_mtok: 1.49
    "gpt-oss-120b":
      prompt_per_mtok: 0.35
      completion_per_mtok: 0.75

    # OpenRouter qwen/qwen3.6-27b via Venice ($0.325 input / $3.25 output per 1M tokens)
    "openrouter:qwen/qwen3.6-27b":
      prompt_per_mtok: 0.325
      completion_per_mtok: 3.25
    "qwen/qwen3.6-27b":
      prompt_per_mtok: 0.325
      completion_per_mtok: 3.25
    "openrouter":
      prompt_per_mtok: 0.325
      completion_per_mtok: 3.25

    # Sarvam LLM
    "sarvam:sarvam-105b-conversations":
      prompt_per_mtok: 0.15
      completion_per_mtok: 0.60
    "sarvam":
      prompt_per_mtok: 0.15
      completion_per_mtok: 0.60
  stt:
    # Sarvam Saaras v4 (₹30.00/hour = ₹0.00833333/sec = $0.000086959564/sec @ 95.83 INR/USD)
    sarvam:
      per_second_inr: 0.0083333333
      per_second: 0.000086959564
    "sarvam:saaras:v4":
      per_second_inr: 0.0083333333
      per_second: 0.000086959564
    # Deepgram Nova-3 ($0.0043/min = $0.00007167/sec = ₹0.006868/sec @ 95.83 INR/USD)
    deepgram:
      per_second_inr: 0.006868
      per_second: 0.00007167
    "deepgram:nova-3":
      per_second_inr: 0.006868
      per_second: 0.00007167
    "nova-3":
      per_second_inr: 0.006868
      per_second: 0.00007167
  tts:
    # Sarvam Bulbul v3 (₹3.00/1,000 chars = ₹0.003/char = $0.000031305437/char @ 95.83 INR/USD)
    sarvam:
      per_character_inr: 0.003
      per_character: 0.000031305437
    "sarvam:bulbul:v3":
      per_character_inr: 0.003
      per_character: 0.000031305437
    # Deepgram Aura TTS ($0.015/1,000 chars = $0.000015/char)
    deepgram:
      per_character_inr: 0.001437
      per_character: 0.000015
    # Murf Falcon 2 ($0.02/1,000 chars = $0.000020/char)
    murf:
      per_character_inr: 0.001917
      per_character: 0.000020
# Optional: only enable for a campaign whose facts exactly match call_repairs.FAQ_TEXTS.
faq_cache_enabled: true
# Optional: approved Meta body template parameters IN THIS ORDER:
# customer name, visit date, visit time, brochure HTTPS URL, floorplan HTTPS URL.
# Empty sources/template fail truthfully; never pretend a send completed.
brochure_delivery:
  # Existing Meta-approved post-call template, with exact reviewed field order.
  # Empty until local account/template validation. No guessed template/free-form send.
  postcall_template_name: ""
  postcall_template_fields: []
  postcall_location_url: ""
  brochure_url: ""
  floorplan_url: ""
  template_name: ""
  template_language: en_US

whatsapp_after_call_only: true
hangup_grace_seconds: 3.0
postcall_whatsapp_enabled: false  # Meta account inactive; manual preparation only, no API queue
