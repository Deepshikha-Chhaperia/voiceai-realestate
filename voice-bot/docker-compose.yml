# Production stack: api + worker (arq retries / lead processing) + postgres + redis.
# Local demo does NOT use compose: `LOCAL_DEMO=1 python main.py` (SQLite + in-memory, zero services).
#
# Scaling beyond one uvicorn process requires REDIS_URL set, which compose already does.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  HOST: "0.0.0.0"
  DATA_DIR: /data
  DATABASE_URL: postgresql+asyncpg://voicebot:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/voicebot_leads
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: voicebot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: voicebot_leads
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicebot -d voicebot_leads"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  api:
    build: .
    restart: unless-stopped
    logging: *logging
    ports:
      - "8000:8000"
    env_file: .env
    environment: *app-env
    volumes:
      - api_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    build: .
    restart: unless-stopped
    logging: *logging
    command: python -m arq leads.worker.WorkerSettings
    env_file: .env
    environment: *app-env
    volumes:
      - api_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "arq", "--check", "leads.worker.WorkerSettings"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  api_data:
